<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francis Chess - Interactive Puzzles, Rules & AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --light-sq: #e2e8f0;
      --dark-sq: #6366f1;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: var(--text);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 0 0 4px;
      font-weight: 800;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      text-align: center;
      font-weight: 500;
    }

    .board-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #c084fc;
      text-align: center;
      margin-bottom: 8px;
      height: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 18px;
      width: 100%;
      max-width: 420px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    #board-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .board-container {
      display: grid;
      grid-template-columns: 20px 1fr;
      grid-template-rows: 1fr 20px;
      width: 100%;
    }

    .ranks-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .files-labels {
      grid-column: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding-top: 4px;
    }

    .board {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    .square {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .square.light { background-color: var(--light-sq); }
    .square.dark { background-color: var(--dark-sq); }

    .piece-white {
      color: #ffffff !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 1px #000000;
    }

    .piece-black {
      color: #0f172a !important;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    
    .square.selected { 
      background-color: #fbbf24 !important; 
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .square.hint { background-color: var(--accent-amber) !important; }

    .legal-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: rgba(16, 185, 129, 0.75);
      border: 2px solid #ffffff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
      animation: pulseDot 1.5s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .controls {
      width: 100%;
      max-width: 400px;
      margin-top: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
    }

    .controls h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
    }

    .btn:hover { 
      opacity: 0.95; 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }
    .btn-secondary { 
      background: rgba(255, 255, 255, 0.1); 
      color: #e2e8f0;
      box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); }
    .btn-warning { 
      background: linear-gradient(135deg, var(--accent-amber) 0%, #d97706 100%); 
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    .btn-danger { 
      background: linear-gradient(135deg, var(--accent-red) 0%, #dc2626 100%); 
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }

    .difficulty-select, .online-input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .difficulty-select:focus, .online-input:focus { border-color: var(--primary); }

    .status-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
      color: #e2e8f0;
    }

    .opening-box {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #a5b4fc;
      font-weight: 700;
      text-align: center;
    }

    .room-list {
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 6px;
      background: rgba(15, 23, 42, 0.6);
    }

    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
    }

    .chat-box {
      height: 90px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      font-size: 0.8rem;
      margin-bottom: 8px;
      text-align: left;
    }

    .chat-msg { margin-bottom: 4px; }

    .pgn-container {
      margin-top: 10px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      max-height: 60px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: left;
      line-height: 1.4;
    }

    .piece-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    .palette-piece {
      font-size: 1.5rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .palette-piece.active {
      background: var(--primary);
      border-color: rgba(255, 255, 255, 0.3);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .guide-section {
      text-align: left;
      line-height: 1.5;
      font-size: 0.85rem;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .guide-section h3 {
      color: #a5b4fc;
      margin-top: 14px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
    }

    .guide-item { margin-bottom: 10px; }
    .guide-item strong { color: #f8fafc; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body>

  <h1>Francis Chess</h1>
  <div class="subtitle">Interactive Puzzles, Custom Sandbox & Computer AI</div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('puzzle', event)">🧩 Puzzles Mode</button>
    <button class="tab-btn" onclick="switchMode('ai', event)">🤖 Play vs Computer</button>
    <button class="tab-btn" onclick="switchMode('online', event)">🕹️ Play Online</button>
    <button class="tab-btn" onclick="switchMode('openings', event)">📖 Openings Library</button>
    <button class="tab-btn" onclick="switchMode('demo', event)">♟️ Movement Demo</button>
    <button class="tab-btn" onclick="switchMode('sandbox', event)">🛠️ Sandbox Builder</button>
    <button class="tab-btn" onclick="switchMode('learn', event)">📖 Learn Chess</button>
  </div>

  <div id="board-wrapper">
    <div id="active-opening-title" class="board-header"></div>
    <div class="board-container">
      <div id="ranks-labels" class="ranks-labels">
        <span>8</span><span>7</span><span>6</span><span>5</span>
        <span>4</span><span>3</span><span>2</span><span>1</span>
      </div>
      <div id="board" class="board"></div>
      <div id="files-labels" class="files-labels">
        <span>a</span><span>b</span><span>c</span><span>d</span>
        <span>e</span><span>f</span><span>g</span><span>h</span>
      </div>
    </div>
  </div>

  <div class="controls" id="controls-panel">
    </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://francis-chess-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const puzzles = [
      { name: "Back-Rank Mate", fen: "6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1", desc: "White to move. Deliver checkmate in 1 move with your Rook.", solution: ["a1a8"], hint: "Look at Black's undefended back rank." },
      { name: "Queen Skewer", fen: "3k4/8/8/3q4/8/8/8/3R2K1 w - - 0 1", desc: "White to move. Skewer the King and win the Queen.", solution: ["d1d5"], hint: "The Black King and Queen are aligned vertically." },
      { name: "Smothered Mate", fen: "6rk/6pp/7N/8/8/8/8/7K w - - 0 1", desc: "White to move. Deliver checkmate using the Knight.", solution: ["h6f7"], hint: "Jump your Knight to f7!" },
      { name: "Scholar's Mate Finish", fen: "r1bqkb1r/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 0 1", desc: "White to move. Deliver checkmate in 1 move.", solution: ["f3f7"], hint: "Target the f7 square with your Queen." },
      { name: "Discovered Check", fen: "3k4/8/8/8/3B4/8/3R4/3K4 w - - 0 1", desc: "White to move. Move the Bishop to reveal check from the Rook.", solution: ["d4b6"], hint: "Move the Bishop out of the way with check." },
      { name: "Rook Checkmate", fen: "4k3/8/4K3/8/8/8/8/7R w - - 0 1", desc: "White to move. Deliver back-rank checkmate with the Rook.", solution: ["h1h8"], hint: "Move your Rook to h8." },
      { name: "Support Mate", fen: "k7/8/1K6/8/8/8/8/7Q w - - 0 1", desc: "White to move. Deliver checkmate supported by the King.", solution: ["h1a1"], hint: "Swing your Queen over to the a-file." },
      { name: "Pawn Promotion Check", fen: "4k3/3P4/8/8/8/8/8/4K3 w - - 0 1", desc: "White to move. Promote the pawn and give check.", solution: ["d7d8q"], hint: "Push your pawn to d8 and promote." },
      { name: "Double Check Mate", fen: "3k4/8/3R1N2/8/8/8/8/3K4 w - - 0 1", desc: "White to move. Deliver mate with a Knight move giving double check.", solution: ["f6e8"], hint: "Move the Knight to e8." }
    ];

    const pieceSymbols = {
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    const difficulties = {
      novice: { depth: 1, skill: 0, movetime: 50 },
      intermediate: { depth: 2, skill: 5, movetime: 100 },
      master: { depth: 4, skill: 15, movetime: 200 },
      grandmaster: { depth: 8, skill: 20, movetime: 400 }
    };

    const openingBook = {
      "e4": "King's Pawn Opening", "d4": "Queen's Pawn Opening", "c4": "English Opening",
      "e4 e5": "Open Game", "e4 e5 Nf3 Nc6 Bb5": "Ruy Lopez", "e4 e5 Nf3 Nc6 Bc4": "Italian Game",
      "e4 c5": "Sicilian Defense", "e4 e6": "French Defense"
    };

    const detailedOpenings = {
      white: [
        { name: "Ruy Lopez", moves: ["e2e4", "e7e5", "g1f3", "b8c6", "f1b5"], label: "e4 e5 Nf3 Nc6 Bb5", desc: "Pressures Black's knight on c6 while building central momentum." },
        { name: "Italian Game", moves: ["e2e4", "e7e5", "g1f3", "b8c6", "f1c4"], label: "e4 e5 Nf3 Nc6 Bc4", desc: "Targets the weak f7 square early to pressure Black." },
        { name: "Four Knights Game", moves: ["e2e4", "e7e5", "g1f3", "b8c6", "b1c3", "g8f6"], label: "e4 e5 Nf3 Nc6 Nc3 Nf6", desc: "Solid and symmetrical piece development." },
        { name: "English Opening", moves: ["c2c4"], label: "c4", desc: "Controls d5 from the flank without committing central pawns immediately." },
        { name: "Torre Attack", moves: ["d2d4", "g8f6", "g1f3", "e7e6", "c1g5"], label: "d4 Nf6 Nf3 e6 Bg5", desc: "Pins or pressures the Knight early on g5." },
        { name: "Scotch Game", moves: ["e2e4", "e7e5", "g1f3", "b8c6", "d2d4"], label: "e4 e5 Nf3 Nc6 d4", desc: "Forces early central pawn exchanges to clear room for pieces." },
        { name: "London System", moves: ["d2d4", "d7d5", "g1f3", "g8f6", "c1f4"], label: "d4 d5 Nf3 Nf6 Bf4", desc: "A highly resilient schematic setup solidifying the center." },
        { name: "Catalan Opening", moves: ["d2d4", "g8f6", "c2c4", "e7e6", "g2g3"], label: "d4 Nf6 c4 e6 g3", desc: "Combines central pressure with a king-side fianchetto." },
        { name: "Réti Opening", moves: ["g1f3", "d7d5", "c2c4"], label: "Nf3 d5 c4", desc: "Hypermodern approach attacking Black's center from distance." },
        { name: "Vienna Game", moves: ["e2e4", "e7e5", "b1c3"], label: "e4 e5 Nc3", desc: "A flexible strategy keeping options open for f4 or Bc4." }
      ],
      black: [
        { name: "Sicilian Defense", moves: ["e2e4", "c7c5"], label: "e4 c5", desc: "Fights asymmetric control over the d4 square." },
        { name: "French Defense", moves: ["e2e4", "e7e6", "d2d4", "d7d5"], label: "e4 e6 d4 d5", desc: "Solid counter-attack directly challenging White's e4 pawn." },
        { name: "Scandinavian Defense", moves: ["e2e4", "d7d5"], label: "e4 d5", desc: "Immediately challenges White's central e4 pawn on move one." },
        { name: "Nimzo-Indian Defense", moves: ["d2d4", "g8f6", "c2c4", "e7e6", "b1c3", "f8b4"], label: "d4 Nf6 c4 e6 Nc3 Bb4", desc: "Pins White's knight to restrain White's central push." },
        { name: "Slav Defense", moves: ["d2d4", "d7d5", "c2c4", "c7c6"], label: "d4 d5 c4 c6", desc: "Supports d5 with c6 without blocking the c8-bishop." },
        { name: "Dutch Defense", moves: ["d2d4", "f7f5"], label: "d4 f5", desc: "An aggressive flank push claiming control over e4." },
        { name: "Alekhine's Defense", moves: ["e2e4", "g8f6"], label: "e4 Nf6", desc: "Provokes White's pawns forward to overextend and attack them." },
        { name: "Pirc Defense", moves: ["e2e4", "d7d6", "d2d4", "g8f6", "b1c3", "g7g6"], label: "e4 d6 d4 Nf6 Nc3 g6", desc: "Hypermodern defense building a solid fortress before hitting back." },
        { name: "Grünfeld Defense", moves: ["d2d4", "g8f6", "c2c4", "g7g6", "b1c3", "d7d5"], label: "d4 Nf6 c4 g6 Nc3 d5", desc: "Challenges White's central pawn center with rapid counter-strikes." },
        { name: "Benoni Defense", moves: ["d2d4", "g8f6", "c2c4", "c7c5"], label: "d4 Nf6 c4 c5", desc: "Creates unbalanced, dynamic positions by attacking d4." }
      ]
    };

    let game = new Chess();
    let currentMode = 'puzzle';
    let currentPuzzleIndex = 0;
    let selectedSquare = null;
    let hintSquare = null;
    let palettePiece = 'P';
    let activeDemoPiece = 'n';
    let currentDifficulty = 'intermediate';
    let playerSide = 'w';
    let engineWorker = null;
    let gameEnded = false;

    // Persistent Device Username
    if (!localStorage.getItem('francis_user_name')) {
      localStorage.setItem('francis_user_name', "User_" + Math.floor(1000 + Math.random() * 9000));
    }
    let playerName = localStorage.getItem('francis_user_name');

    // Online Multiplayer States
    let currentRoomId = null;
    let onlineRole = 'w';

    function initEngine() {
      if (window.Worker) {
        try {
          const blob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`], { type: 'application/javascript' });
          engineWorker = new Worker(URL.createObjectURL(blob));
        } catch (e) {
          engineWorker = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        }

        engineWorker.onmessage = function(event) {
          const line = event.data;
          if (line.startsWith('bestmove')) {
            const moveStr = line.split(' ')[1];
            if (moveStr && moveStr !== '(none)') {
              const from = moveStr.substring(0, 2);
              const to = moveStr.substring(2, 4);
              const promotion = moveStr.length > 4 ? moveStr[4] : 'q';
              game.move({ from, to, promotion });
              renderBoard();
              updateGameStatus();
            }
          }
        };
      }
    }

    function init() {
      initEngine();
      loadPuzzle(0);
    }

    function updateUsername(val) {
      const trimmed = val.trim();
      if (trimmed) {
        playerName = trimmed;
        localStorage.setItem('francis_user_name', playerName);
      }
    }

    function setBoardTitle(title) {
      const el = document.getElementById('active-opening-title');
      if (el) el.textContent = title;
    }

    function renderBoardLabels(isFlipped) {
      const ranksEl = document.getElementById('ranks-labels');
      const filesEl = document.getElementById('files-labels');
      
      if (ranksEl) {
        ranksEl.innerHTML = isFlipped ? 
          '<span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>' :
          '<span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>';
      }
      if (filesEl) {
        filesEl.innerHTML = isFlipped ?
          '<span>h</span><span>g</span><span>f</span><span>e</span><span>d</span><span>c</span><span>b</span><span>a</span>' :
          '<span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>';
      }
    }

    function switchMode(mode, evt) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt) evt.target.classList.add('active');

      const wrapper = document.getElementById('board-wrapper');
      selectedSquare = null;
      hintSquare = null;
      gameEnded = false;
      setBoardTitle("");

      if (mode === 'learn') {
        wrapper.style.display = 'none';
        renderLearnControls();
        return;
      }

      wrapper.style.display = 'block';

      if (mode === 'puzzle') {
        loadPuzzle(currentPuzzleIndex);
      } else if (mode === 'ai') {
        resetAIGame();
      } else if (mode === 'online') {
        game.reset();
        renderBoard();
        renderOnlineControls();
        listenToRoomList();
      } else if (mode === 'openings') {
        game.reset();
        renderBoard();
        renderOpeningsControls();
      } else if (mode === 'demo') {
        setDemoPiece(activeDemoPiece);
        renderDemoControls();
      } else if (mode === 'sandbox') {
        game.clear();
        renderBoard();
        renderSandboxControls();
      }
    }

    function renderBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';
      const boardState = game.board();
      const isFlipped = (currentMode === 'ai' && playerSide === 'b') || (currentMode === 'online' && onlineRole === 'b');

      renderBoardLabels(isFlipped);

      let legalMoves = [];
      if (selectedSquare && !gameEnded) {
        legalMoves = game.moves({ square: selectedSquare, verbose: true }).map(m => m.to);
      } else if (currentMode === 'demo') {
        const demoSquare = findDemoPieceSquare();
        if (demoSquare) {
          legalMoves = game.moves({ square: demoSquare, verbose: true }).map(m => m.to);
        }
      }

      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const r = isFlipped ? 7 - i : i;
          const c = isFlipped ? 7 - j : j;

          const squareName = String.fromCharCode(97 + c) + (8 - r);
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.square = squareName;

          if (selectedSquare === squareName) square.classList.add('selected');
          if (hintSquare === squareName) square.classList.add('hint');

          const piece = boardState[r][c];
          if (piece) {
            const pieceChar = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
            square.textContent = pieceSymbols[pieceChar] || '';
            square.classList.add(piece.color === 'w' ? 'piece-white' : 'piece-black');
          }

          if (legalMoves.includes(squareName)) {
            const dot = document.createElement('div');
            dot.className = 'legal-dot';
            square.appendChild(dot);
          }

          square.onclick = () => handleSquareClick(squareName);
          boardElement.appendChild(square);
        }
      }
    }

    function findDemoPieceSquare() {
      const boardState = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (boardState[r][c]) {
            return String.fromCharCode(97 + c) + (8 - r);
          }
        }
      }
      return null;
    }

    function detectOpening() {
      const historyStr = game.history().join(' ');
      let matchedOpening = 'Standard Opening / Custom';
      let longestMatchLen = 0;

      for (const [moves, name] of Object.entries(openingBook)) {
        if (historyStr === moves || historyStr.startsWith(moves + ' ')) {
          if (moves.length > longestMatchLen) {
            longestMatchLen = moves.length;
            matchedOpening = name;
          }
        }
      }
      return matchedOpening;
    }

    function handleSquareClick(square) {
      if (gameEnded) return;

      if (currentMode === 'sandbox') {
        if (palettePiece) {
          const color = palettePiece === palettePiece.toUpperCase() ? 'w' : 'b';
          const type = palettePiece.toLowerCase();
          game.put({ type, color }, square);
          renderBoard();
        }
        return;
      }

      if (currentMode === 'demo') {
        const currentSquare = findDemoPieceSquare();
        if (currentSquare && currentSquare !== square) {
          const move = game.move({ from: currentSquare, to: square, promotion: 'q' });
          if (!move) {
            const piece = game.get(currentSquare);
            game.clear();
            if (piece) game.put(piece, square);
          }
        }
        renderBoard();
        return;
      }

      if (currentMode === 'ai' && game.turn() !== playerSide) return;

      if (currentMode === 'online') {
        if (!currentRoomId) return;
        if (game.turn() !== onlineRole) return;
      }

      if (!selectedSquare) {
        const piece = game.get(square);
        if (piece && ((currentMode === 'puzzle' || currentMode === 'ai' || currentMode === 'online') ? piece.color === game.turn() : true)) {
          selectedSquare = square;
          renderBoard();
        }
      } else {
        const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        if (move) {
          hintSquare = null;
          if (currentMode === 'puzzle') {
            checkPuzzleSolution(move);
          } else if (currentMode === 'ai' && !game.game_over()) {
            updateGameStatus('Thinking...');
            setTimeout(makeCatchfishMove, 50);
          } else if (currentMode === 'online' && currentRoomId) {
            db.ref('rooms/' + currentRoomId).update({
              fen: game.fen(),
              turn: game.turn()
            });
            updateGameStatus();
          }
        }
        selectedSquare = null;
        renderBoard();
      }
    }

    function demoOpening(name, moveList) {
      game.reset();
      for (let m of moveList) {
        let from = m.substring(0, 2);
        let to = m.substring(2, 4);
        game.move({ from, to, promotion: 'q' });
      }
      setBoardTitle(name);
      renderBoard();
    }

    function loadPuzzle(index) {
      currentPuzzleIndex = index;
      const puzzle = puzzles[index];
      game.load(puzzle.fen);
      selectedSquare = null;
      hintSquare = null;
      gameEnded = false;
      renderBoard();
      renderPuzzleControls();
    }

    function showPuzzleHint() {
      const puzzle = puzzles[currentPuzzleIndex];
      const statusEl = document.getElementById('puzzle-status');
      if (puzzle && puzzle.solution.length > 0) {
        const solutionMove = puzzle.solution[0];
        hintSquare = solutionMove.substring(0, 2);
        renderBoard();
        if (statusEl) {
          statusEl.style.color = '#fbbf24';
          statusEl.textContent = `💡 Hint: ${puzzle.hint}`;
        }
      }
    }

    function checkPuzzleSolution(move) {
      const puzzle = puzzles[currentPuzzleIndex];
      const moveStr = move.from + move.to;
      const statusEl = document.getElementById('puzzle-status');

      if (puzzle.solution.includes(moveStr) || game.in_checkmate()) {
        statusEl.style.color = '#34d399';
        statusEl.textContent = '🎉 Correct! Puzzle Solved!';
        gameEnded = true;
      } else {
        statusEl.style.color = '#f87171';
        statusEl.textContent = '❌ Incorrect move. Try again!';
        setTimeout(() => loadPuzzle(currentPuzzleIndex), 1000);
      }
    }

    function makeCatchfishMove() {
      if (gameEnded) return;
      const cfg = difficulties[currentDifficulty];
      if (engineWorker) {
        engineWorker.postMessage('uci');
        engineWorker.postMessage(`setoption name Skill Level value ${cfg.skill}`);
        engineWorker.postMessage(`position fen ${game.fen()}`);
        engineWorker.postMessage(`go depth ${cfg.depth} movetime ${cfg.movetime}`);
      } else {
        const moves = game.moves();
        if (moves.length === 0) return;
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        game.move(randomMove);
        renderBoard();
        updateGameStatus();
      }
    }

    function updateGameStatus(customMsg) {
      const statusEl = document.getElementById('game-status');
      const openingEl = document.getElementById('opening-name');
      const pgnEl = document.getElementById('pgn-log');

      if (openingEl) {
        openingEl.textContent = `Opening: ${detectOpening()}`;
      }

      if (pgnEl) {
        pgnEl.textContent = game.pgn() || '1. ...';
        pgnEl.scrollTop = pgnEl.scrollHeight;
      }

      if (!statusEl) return;

      if (customMsg) {
        statusEl.textContent = customMsg;
        return;
      }

      if (game.in_checkmate()) {
        gameEnded = true;
        statusEl.textContent = game.turn() === 'w' ? 'Checkmate! Black wins.' : 'Checkmate! White wins!';
      } else if (game.in_draw()) {
        gameEnded = true;
        statusEl.textContent = 'Game drawn!';
      } else {
        if (currentMode === 'online') {
          statusEl.textContent = game.turn() === onlineRole ? `Your Turn (${onlineRole === 'w' ? 'White' : 'Black'})` : `Opponent's Turn (${game.turn() === 'w' ? 'White' : 'Black'})`;
        } else {
          statusEl.textContent = game.turn() === playerSide ? `Your Turn (${playerSide === 'w' ? 'White' : 'Black'})` : "Catchfish Engine 18's turn";
        }
      }
    }

    function setPlayerSide(side) {
      playerSide = side;
      resetAIGame();
    }

    function resetAIGame() {
      gameEnded = false;
      game.reset();
      renderBoard();
      renderAIControls();
      updateGameStatus();
      if (playerSide === 'b') {
        setTimeout(makeCatchfishMove, 200);
      }
    }

    function copyPGNToClipboard() {
      const pgnText = game.pgn();
      if (!pgnText) {
        alert("No moves have been made yet!");
        return;
      }
      navigator.clipboard.writeText(pgnText).then(() => {
        alert("PGN copied to clipboard!");
      }).catch(err => {
        console.error("Failed to copy PGN: ", err);
      });
    }

    function resignGame() {
      gameEnded = true;
      if (currentMode === 'online' && currentRoomId) {
        const winner = onlineRole === 'w' ? 'Black' : 'White';
        db.ref('rooms/' + currentRoomId).update({
          status: `${playerName} Resigned. ${winner} Wins!`
        });
      } else {
        updateGameStatus("You Resigned. Computer Wins!");
      }
    }

    function offerDraw() {
      if (currentMode === 'online' && currentRoomId) {
        db.ref('rooms/' + currentRoomId).update({
          status: `${playerName} Offered a Draw.`
        });
      } else {
        updateGameStatus("Draw offered. Computer accepted the Draw!");
        gameEnded = true;
      }
    }

    // Multiplayer Room & Chat Logic
    function createOnlineRoom() {
      const roomInput = document.getElementById('create-room-name');
      const roomName = (roomInput && roomInput.value.trim()) ? roomInput.value.trim() : (playerName + "'s Game");
      const targetRoomId = roomName.replace(/[^a-zA-Z0-9]/g, "_");

      if (currentRoomId) {
        db.ref('rooms/' + currentRoomId).off();
        db.ref('chats/' + currentRoomId).off();
      }

      currentRoomId = targetRoomId;
      onlineRole = Math.random() < 0.5 ? 'w' : 'b';
      gameEnded = false;

      const hostWhite = onlineRole === 'w' ? playerName : "Waiting...";
      const hostBlack = onlineRole === 'b' ? playerName : "Waiting...";

      db.ref('rooms/' + currentRoomId).set({
        name: roomName,
        white: hostWhite,
        black: hostBlack,
        hostRole: onlineRole,
        fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
        turn: 'w',
        status: 'Game Active'
      }).then(() => {
        subscribeToRoom();
      });
    }

    function joinOnlineRoom(targetRoomId) {
      if (!targetRoomId) {
        const joinInput = document.getElementById('join-room-name');
        if (joinInput && joinInput.value.trim()) {
          targetRoomId = joinInput.value.trim().replace(/[^a-zA-Z0-9]/g, "_");
        }
      }
      if (!targetRoomId) return;

      if (currentRoomId) {
        db.ref('rooms/' + currentRoomId).off();
        db.ref('chats/' + currentRoomId).off();
      }

      currentRoomId = targetRoomId;
      gameEnded = false;

      db.ref('rooms/' + currentRoomId).once('value').then((snapshot) => {
        const data = snapshot.val();
        if (!data) {
          alert("Room not found!");
          return;
        }

        if (data.white === playerName) {
          onlineRole = 'w';
        } else if (data.black === playerName) {
          onlineRole = 'b';
        } else if (data.white === 'Waiting...') {
          onlineRole = 'w';
          db.ref('rooms/' + currentRoomId).update({ white: playerName });
        } else if (data.black === 'Waiting...') {
          onlineRole = 'b';
          db.ref('rooms/' + currentRoomId).update({ black: playerName });
        } else {
          alert("Room is already full!");
          return;
        }

        subscribeToRoom();
      });
    }

    function listenToRoomList() {
      db.ref('rooms').on('value', (snapshot) => {
        const roomContainer = document.getElementById('public-rooms-list');
        if (!roomContainer) return;
        roomContainer.innerHTML = '';
        const rooms = snapshot.val();
        if (!rooms) {
          roomContainer.innerHTML = '<div style="font-size:0.8rem; color:#64748b;">No active rooms found. Create or join one!</div>';
          return;
        }

        Object.keys(rooms).forEach((key) => {
          const room = rooms[key];
          const isFull = room.white !== 'Waiting...' && room.black !== 'Waiting...' && room.white !== playerName && room.black !== playerName;
          const div = document.createElement('div');
          div.className = 'room-item';
          div.innerHTML = `
            <span><strong>${room.name}</strong> (${room.white} vs ${room.black})</span>
            <button class="btn" style="padding: 4px 10px;" onclick="joinOnlineRoom('${key}')" ${isFull ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>${isFull ? 'Full' : 'Join'}</button>
          `;
          roomContainer.appendChild(div);
        });
      });
    }

    function subscribeToRoom() {
      db.ref('rooms/' + currentRoomId).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        game.load(data.fen);
        renderBoard();
        if (data.status && data.status !== 'Game Active') {
          updateGameStatus(data.status);
          gameEnded = true;
        } else {
          updateGameStatus();
        }
        const netStatus = document.getElementById('net-status');
        if (netStatus) {
          netStatus.textContent = `🟢 Room: ${data.name} | White: ${data.white} | Black: ${data.black}`;
        }
      });

      db.ref('chats/' + currentRoomId).on('value', (snapshot) => {
        const chatBox = document.getElementById('chat-messages');
        if (!chatBox) return;
        chatBox.innerHTML = '';
        const chats = snapshot.val();
        if (chats) {
          Object.values(chats).forEach((msg) => {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<strong style="color:#a5b4fc;">${msg.sender}:</strong> ${msg.text}`;
            chatBox.appendChild(div);
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input ? input.value.trim() : '';
      if (!text || !currentRoomId) return;

      db.ref('chats/' + currentRoomId).push({
        sender: playerName,
        text: text
      });
      input.value = '';
    }

        </div>
        <div style="margin-top:15px; display:flex; gap:8px;">
          <button class="btn btn-secondary" onclick="game.reset(); renderBoard();">Standard Setup</button>
          <button class="btn btn-danger" onclick="game.clear(); renderBoard();">Clear Board</button>
        </div>
      `;
    }

    function selectPalettePiece(p) {
      palettePiece = p;
      renderSandboxControls();
    }

    function renderLearnControls() {
      const controls = document.getElementById('controls-panel');
      controls.innerHTML = `
        <div class="guide-section">
          <h3>♟️ How Pieces Move & Capture</h3>
          <div class="guide-item">
            <strong>Pawn (♙/♟):</strong> Moves forward 1 square (or 2 squares on its very first move). Captures 1 square diagonally forward.
          </div>
          <div class="guide-item">
            <strong>Knight (♘/♞):</strong> Moves in an "L-shape" (2 squares vertically + 1 horizontally, or vice versa). It is the only piece that can jump over other pieces. Captures by landing on an opponent piece.
          </div>
          <div class="guide-item">
            <strong>Bishop (♗/♝):</strong> Moves and captures any number of squares diagonally. Remains on its starting square color throughout the game.
          </div>
          <div class="guide-item">
            <strong>Rook (♖/♜):</strong> Moves and captures any number of squares horizontally or vertically in straight lines.
          </div>
          <div class="guide-item">
            <strong>Queen (♕/♛):</strong> Combines the power of the Rook and Bishop. Moves and captures any number of squares diagonally, horizontally, or vertically.
          </div>
          <div class="guide-item">
            <strong>King (♔/♚):</strong> Moves and captures 1 square in any direction (horizontal, vertical, or diagonal). Must be protected at all costs.
          </div>

          <h3>📜 Fundamental Chess Concepts</h3>
          <div class="guide-item">
            <strong>Check:</strong> Occurs when a King is directly under attack by an opponent's piece. The King MUST escape check immediately by moving, blocking, or capturing the attacking piece.
          </div>
          <div class="guide-item">
            <strong>Checkmate:</strong> Occurs when a King is in Check and has no legal moves to escape. This ends and wins the game!
          </div>
          <div class="guide-item">
            <strong>En Passant:</strong> A special pawn capture. If an opponent advances a pawn 2 squares forward right next to your pawn, you can capture it diagonally behind as if it had only moved 1 square (must be done immediately on that turn).
          </div>
          <div class="guide-item">
            <strong>Pawn Promotion:</strong> When a pawn reaches the opposite end of the board (the 8th rank for White, 1st rank for Black), it must be promoted to a Queen, Rook, Bishop, or Knight!
          </div>
        </div>
      `;
    }

    window.onload = init;
  </script>
</body>
</html>
